name: mapmemo
description: "MapMemo - harita destekli ani kaydetme uygulamasi (Android & iOS)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (Auth, Firestore, Storage)
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # Google Sign-In & Maps
  google_sign_in: ^7.2.0
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3

  # State management & DI
  provider: ^6.1.5+1
  get_it: ^9.2.1

  # Media (photo/video for memories)
  image_picker: ^1.2.3
  video_player: ^2.11.1
  cached_network_image: ^3.4.1

  # UI helpers
  flutter_rating_bar: ^4.0.1

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.3
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
